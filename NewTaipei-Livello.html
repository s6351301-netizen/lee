<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新北市泰山職訓打卡地圖-雙軸水平儀模式</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        /* 右上角動態資訊面板 */
        .info-panel {
            padding: 12px 15px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            border-left: 5px solid #1a73e8;
            min-width: 200px;
        }
        .info-panel h4 { margin: 0 0 5px 0; color: #333; font-size: 16px; }
        .info-panel p { margin: 3px 0; color: #666; }
        .highlight { color: #e81123; font-weight: bold; font-size: 18px; }
        
        /* 底部操作控制區 */
        #action-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 100%;
            margin-bottom: 10px;
        }
        .btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .btn-history { background-color: #2196F3; }
        
        /* 水平儀比對畫面遮罩層（延續水聲版風格，高質感科技暗色調） */
        #level-view {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #111;
            z-index: 2000;
            color: white;
            box-sizing: border-box;
        }
        
        /* 滿版核對觀景窗 */
        #comparison-frame {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }
        .frame-blind {
            background: rgba(0, 0, 0, 0.85);
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 16px;
        }
        .center-row {
            display: flex;
            flex-grow: 1;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        /* 🎛️ 水平儀雙軸對齊核心視覺區 */
        .level-container {
            width: 260px;
            height: 260px;
            border: 3px dashed #2196F3;
            border-radius: 12px;
            position: relative;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            box-shadow: 0 0 20px rgba(33, 150, 243, 0.3);
            overflow: hidden;
        }
        /* 十字標線 */
        .cross-h {
            position: absolute; top: 50%; left: 0; width: 100%; height: 2px;
            background: rgba(255,255,255,0.2); transform: translateY(-50%);
        }
        .cross-v {
            position: absolute; left: 50%; top: 0; width: 2px; height: 100%;
            background: rgba(255,255,255,0.2); transform: translateX(-50%);
        }
        /* 5% 綠色完美得分中心圈 */
        .target-center-zone {
            position: absolute; top: 50%; left: 50%;
            width: 26px; height: 26px;
            border: 2px solid #00FF00; border-radius: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 255, 0, 0.1);
            pointer-events: none;
            z-index: 10;
        }
        
        /* 動態後照鏡圖示 (控制前後傾斜 - 垂直軸) */
        .mirror-icon {
            width: 90px;
            height: auto;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 0 8px #2196F3);
            transition: top 0.05s linear;
        }
        
        /* 動態白色磁磚線條 (控制左右傾斜 - 水平軸) */
        .tile-line {
            width: 80px;
            height: 12px;
            background: #FFFFFF;
            border: 1px solid #CCCCCC;
            border-radius: 2px;
            position: absolute;
            top: 85%; left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
            transition: left 0.05s linear;
        }
        
        /* 下方操作提示台 */
        .ar-control-panel {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 340px;
            text-align: center;
            z-index: 2100;
        }
        .ar-tip-text {
            color: #00FF00;
            font-size: 15px;
            font-weight: bold;
            text-shadow: 0 0 8px #000;
            background: rgba(0,0,0,0.8);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid #2196F3;
            line-height: 1.5;
        }
        .capture-btn {
            background-color: #2196F3;
            color: white;
            border: 2px solid white;
            padding: 14px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            width: 100%;
        }
        .close-btn {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(255,255,255,0.8);
            border: none; padding: 8px 16px; border-radius: 5px;
            font-size: 14px; font-weight: bold; z-index: 2200;
            cursor: pointer;
            color: black;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="action-container">
        <button id="ar-btn" class="btn" disabled onclick="openLevelComparison()">距離太遠（GPS 鎖定中）</button>
        <button class="btn btn-history" onclick="viewHistory()">查看歷史數據</button>
    </div>

    <!-- 雙軸水平儀比對介面 -->
    <div id="level-view">
        <div id="comparison-frame">
            <div class="frame-blind">📐 實地後照鏡與磁磚雙軸水平核對</div>
            <div class="center-row">
                
                <div class="level-container">
                    <div class="cross-h"></div>
                    <div class="cross-v"></div>
                    <div class="target-center-zone"></div>
                    
                    <!-- 後照鏡：受垂直軸 (Beta) 驅動上下移動 -->
                    <img id="mirror" class="mirror-icon" src="https://s6351301-netizen.github.io/lee/icon/Livello.png" alt="後照鏡">
                    
                    <!-- 白色磁磚：受水平軸 (Gamma) 驅動左右移動 -->
                    <div id="tile" class="tile-line"></div>
                </div>

            </div>
            <div class="frame-blind" style="padding-bottom:120px;">⚠️ 垂直與水平皆須進入 5% 誤差圈內才計分</div>
        </div>
        
        <div class="ar-control-panel">
            <div class="ar-tip-text">
                垂直(Beta): <span id="ui-beta" style="color:white;">0.0</span>° | 水平(Gamma): <span id="ui-gamma" style="color:white;">0.0</span>°<br>
                <span id="lock-status" style="color:#FF3B30;">❌ 尚未對齊，請微調手機傾角</span>
            </div>
            <button class="capture-btn" onclick="verifyLevelAndScore()">[ 📐 水平校對：確認雙軸鎖定 ]</button>
        </div>
        <button class="close-btn" onclick="closeLevel()">關閉功能</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 🎯 已更新：使用您提供的新 Google Maps 街景真實經緯度
        const targetSpot = {
            name: "泰山職訓中心休息區",
            lat: 25.044492, 
            lng: 121.4196891,
            score: 0,
            hasScored: false
        };

        // 目前手機即時角度變數
        let currentBeta = 0;
        let currentGamma = 0;

        function saveScoreToHistory(score) {
            const history = JSON.parse(localStorage.getItem('gameHistory') || '[]');
            history.push({
                date: new Date().toLocaleString(),
                score: score
            });
            localStorage.setItem('gameHistory', JSON.stringify(history));
        }

        function viewHistory() {
            const history = JSON.parse(localStorage.getItem('gameHistory') || '[]');
            const storagePathText = `手機實體路徑: /data/user/0/com.android.chrome/app_tabs/0/localstorage/leveldb\n儲存檔案名稱: 000003.log / CURRENT / MANIFEST\n資料庫欄位名稱 (Key): gameHistory`;

            if (history.length === 0) {
                alert(`【打卡歷史紀錄】\n\n目前尚無遊戲歷史紀錄。\n\n💾 存檔位置：\n${storagePathText}`);
            } else {
                let report = "【打卡歷史紀錄】\n\n";
                history.forEach((entry, index) => {
                    report += `${index + 1}. ${entry.date} | 得分: +${entry.score}\n`;
                });
                
                report += `\n💾 存檔位置：\n${storagePathText}`;
                alert(report);
            }
        }

        const map = L.map('map').setView([targetSpot.lat, targetSpot.lng], 16);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const targetMarker = L.marker([targetSpot.lat, targetSpot.lng]).addTo(map)
            .bindPopup(`<b>${targetSpot.name}</b><br>水平儀打卡據點`).openPopup();

        const detectionCircle = L.circle([targetSpot.lat, targetSpot.lng], {
            color: '#2196F3',
            fillColor: '#2196F3',
            fillOpacity: 0.1,
            radius: 80 
        }).addTo(map);

        let userMarker = null;

        const info = L.control({ position: 'topright' });
        info.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info-panel');
            this.update(null, "GPS 定位中...");
            return this._div;
        };
        info.update = function (distance, scoreText) {
            let distStr = distance !== null ? `${distance.toFixed(1)} 公尺` : "未知";
            this._div.innerHTML = `
                <h4>雙軸水平儀打卡系統</h4>
                <p>目前得分：<span class="highlight" style="color:green;">${targetSpot.score} 分</span></p>
                <p>目標景點：<b>${targetSpot.name}</b></p>
                <p>與目標距離：<span class="highlight">${distStr}</span></p>
                <p>狀態：${scoreText}</p>
            `;
        };
        info.addTo(map);

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(function(position) {
                const uLat = position.coords.latitude;
                const uLng = position.coords.longitude;

                if (!userMarker) {
                    userMarker = L.circleMarker([uLat, uLng], { radius: 8, color: '#1a73e8', fillColor: '#1a73e8', fillOpacity: 1 }).addTo(map);
                } else {
                    userMarker.setLatLng([uLat, uLng]);
                }

                const distance = getDistance(uLat, uLng, targetSpot.lat, targetSpot.lng);
                const arBtn = document.getElementById('ar-btn');

                if (distance <= 80) {
                    if (!targetSpot.hasScored) {
                        info.update(distance, "<span style='color:green; font-weight:bold;'>已進入 80 米打卡區！請啟動水平儀。</span>");
                        arBtn.disabled = false;
                        arBtn.style.backgroundColor = "#2196F3";
                        arBtn.innerText = "📐 進入範圍：開啟雙軸水平儀";
                    } else {
                        info.update(distance, "此據點已完成水平儀打卡。");
                        arBtn.disabled = true;
                        arBtn.style.backgroundColor = "#cccccc";
                        arBtn.innerText = "已完成打卡";
                    }
                } else {
                    info.update(distance, "未進入 80 米範圍 (請繼續靠近目的地)");
                    arBtn.disabled = true;
                    arBtn.style.backgroundColor = "#cccccc";
                    arBtn.innerText = "距離太遠（GPS 鎖定中）";
                }

            }, function(error) {
                console.error(error);
                info.update(null, "<span style='color:red;'>請開啟手機高精度 GPS 權限</span>");
            }, {
                enableHighAccuracy: true,
                maximumAge: 1000,
                timeout: 5000
            });
        }

        // --- ⚙️ 陀螺儀核心監測與動畫渲染機制 ---
        const levelView = document.getElementById('level-view');
        const mirror = document.getElementById('mirror');
        const tile = document.getElementById('tile');
        const uiBeta = document.getElementById('ui-beta');
        const uiGamma = document.getElementById('ui-gamma');
        const lockStatus = document.getElementById('lock-status');
        
        const MAX_MOVE_PX = 110; // 最大移動限制邊界 (像素)

        function openLevelComparison() {
            levelView.style.display = 'block';

            // iOS 13+ 安全權限請求認證
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                        } else {
                            alert('必須允許感測器權限才能進行水平校對！');
                            closeLevel();
                        }
                    })
                    .catch(err => {
                        console.error(err);
                        closeLevel();
                    });
            } else {
                // 一般 Android 或桌面端瀏覽器
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        function handleOrientation(event) {
            // Beta: 前後翻轉（控制垂直軸，對應後照鏡上下移動）
            // Gamma: 左右翻轉（控制水平軸，對應白色磁磚左右移動）
            currentBeta = event.beta || 0;
            currentGamma = event.gamma || 0;

            uiBeta.innerText = currentBeta.toFixed(1);
            uiGamma.innerText = currentGamma.toFixed(1);

            // 運算元件在圓盤內的位移量（設定最大安全感應區為 ±30 度）
            let moveY = (currentBeta / 30) * MAX_MOVE_PX;
            let moveX = (currentGamma / 30) * MAX_MOVE_PX;

            // 限制元件邊界防止溢出
            moveY = Math.max(-MAX_MOVE_PX, Math.min(MAX_MOVE_PX, moveY));
            moveX = Math.max(-MAX_MOVE_PX, Math.min(MAX_MOVE_PX, moveX));

            // 即時渲染元件位置
            // 垂直控制：後照鏡向上/下偏移
            mirror.style.top = `calc(50% + ${moveY}px)`;
            // 水平控制：白色磁磚向左/右偏移
            tile.style.left = `calc(50% + ${moveX}px)`;

            // 🎯 即時檢測是否符合 5% 誤差門檻 (30度 * 5% = ±1.5度)
            if (Math.abs(currentBeta) <= 1.5 && Math.abs(currentGamma) <= 1.5) {
                lockStatus.innerHTML = "🟢 【雙軸完美鎖定！】可以點擊下方按鈕打卡！";
                lockStatus.style.color = "#00FF00";
            } else {
                lockStatus.innerHTML = "❌ 尚未對齊，請微調手機傾角";
                lockStatus.style.color = "#FF3B30";
            }
        }

        // 🎯 水平儀相似度檢核引擎（誤差 5% 以內判定得分標準）
        function verifyLevelAndScore() {
            if (targetSpot.hasScored) {
                alert("此據點已得分，無法重複打卡！");
                closeLevel();
                return;
            }

            const currentLatLng = userMarker ? userMarker.getLatLng() : {lat: 0, lng: 0};
            const currentDist = getDistance(currentLatLng.lat, currentLatLng.lng, targetSpot.lat, targetSpot.lng);

            if (currentDist <= 80) {
                // 嚴格 5% 誤差條件判定 (絕對值必須小於等於 1.5 度)
                const isVerticalOk = Math.abs(currentBeta) <= 1.5;
                const isHorizontalOk = Math.abs(currentGamma) <= 1.5;

                if (isVerticalOk && isHorizontalOk) {
                    targetSpot.score += 100;
                    targetSpot.hasScored = true;
                    
                    saveScoreToHistory(100);
                    
                    alert(`🌟 雙軸校對成功！\n垂直誤差：${((Math.abs(currentBeta)/30)*100).toFixed(1)}%\n水平誤差：${((Math.abs(currentGamma)/30)*100).toFixed(1)}%\n完美符合 5% 得分標準！獲得積分：+100 分！`);
                    closeLevel();
                    info.update(currentDist, "<span style='color:gold; font-weight:bold;'>🎉 任務完成！順利通過水平儀挑戰。</span>");
                } else {
                    let errMsg = "❌ 校對失敗！雙軸尚未完美重合。\n\n";
                    if(!isVerticalOk) errMsg += `🔺 垂直軸(後照鏡)目前誤差過大（角度：${currentBeta.toFixed(1)}°）\n`;
                    if(!isHorizontalOk) errMsg += `🔹 水平軸(白磁磚)目前誤差過大（角度：${currentGamma.toFixed(1)}°）\n`;
                    errMsg += "\n【提示】：請將手機完全水平平放（如同放在桌面上），讓後照鏡與磁磚都進入中央綠色小圈圈中。";
                    alert(errMsg);
                }
            } else {
                alert("❌ 打卡失敗！您已離開 80 公尺範圍。");
                closeLevel();
            }
        }

        function closeLevel() {
            levelView.style.display = 'none';
            window.removeEventListener('deviceorientation', handleOrientation);
        }
    </script>
</body>
</html>
