<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>泰山職訓中心-實景 LOG 核對打卡</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; overflow: hidden; }
        #map { width: 100%; height: 100%; }
        
        /* 浮動 LOG 核對視窗 */
        #log-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 3000; color: white; text-align: center;
            padding-top: 50px;
        }
        #log-overlay img { width: 80%; max-width: 400px; border: 5px solid #fff; margin: 20px 0; }
        .close-overlay {
            position: absolute; top: 20px; right: 20px; font-size: 30px; cursor: pointer; color: white;
        }

        /* 鏡頭遮罩層 */
        #camera-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000; background: #000; }
        #video { width: 100%; height: 100%; object-fit: cover; }
        .capture-btn { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 15px 30px; z-index: 2100; }
        .info-panel { padding: 10px; background: rgba(255,255,255,0.9); position: absolute; top: 10px; right: 10px; z-index: 1000; }
        .btn { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; padding: 15px 30px; border-radius: 50px; border: none; background: #4CAF50; color: white; font-weight: bold; }
    </style>
</head>
<body>

    <div id="map"></div>
    <button id="ar-btn" class="btn" disabled onclick="showLogOverlay()">進入範圍：開啟實景核對</button>

    <!-- LOG 核對視窗 -->
    <div id="log-overlay">
        <span class="close-overlay" onclick="closeOverlay()">×</span>
        <h2>請核對泰山職訓中心 LOG</h2>
        <p>請將鏡頭對準現場LOG外觀，完整對齊外框拍照確認即可得分！</p>
        <img src="./icon/TaishanLog.png" alt="泰山職訓中心 LOG">
        <button class="btn" onclick="openCamera()">開始拍照核對</button>
    </div>

    <!-- 鏡頭畫面 -->
    <div id="camera-view">
        <video id="video" autoplay playsinline></video>
        <button class="capture-btn" onclick="captureAndVerify()">📸 拍照確認</button>
        <button class="close-overlay" style="top:10px;" onclick="closeCamera()">×</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const targetSpot = { lat: 25.044492, lng: 121.4196891 };
        
        function showLogOverlay() { document.getElementById('log-overlay').style.display = 'block'; }
        function closeOverlay() { document.getElementById('log-overlay').style.display = 'none'; }
        
        function openCamera() {
            closeOverlay();
            const cameraView = document.getElementById('camera-view');
            cameraView.style.display = 'block';
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then(stream => { document.getElementById('video').srcObject = stream; })
                .catch(err => alert("無法開啟相機"));
        }

        function closeCamera() {
            document.getElementById('camera-view').style.display = 'none';
            const stream = document.getElementById('video').srcObject;
            if(stream) stream.getTracks().forEach(track => track.stop());
        }

        function captureAndVerify() {
            alert("正在比對 LOG 外框... 檢測到完整外框，恭喜得分！");
            closeCamera();
            // 此處可加入您的後端儲存邏輯
        }

        // GPS 定位邏輯 (簡化版)
        const map = L.map('map').setView([25.044492, 121.4196891], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        navigator.geolocation.watchPosition(pos => {
            const btn = document.getElementById('ar-btn');
            btn.disabled = false;
            btn.innerText = "📸 進入範圍：開啟實景核對";
        });
    </script>
</body>
</html>
