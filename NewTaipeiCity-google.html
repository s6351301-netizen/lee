<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>泰山職訓中心-打卡系統</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: "Microsoft JhengHei", sans-serif; overflow: hidden; }
        #map { width: 100%; height: 100%; }
        
        /* 登入視窗 */
        #login-modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; display:flex; flex-direction:column; justify-content:center; align-items:center; color:white; }
        input { padding: 15px; border-radius: 5px; border:none; margin: 10px; width: 80%; max-width: 300px; color: black; }
        .btn { background: #4CAF50; color: white; border: none; padding: 15px 30px; border-radius: 50px; cursor: pointer; font-size: 18px; font-weight: bold; }

        /* 導覽盤控制區 */
        #action-container { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; width: 90%; max-width: 400px; text-align: center; }
        #camera-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; }
        #video { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <div id="login-modal">
        <h2>請輸入您的姓名以開始打卡</h2>
        <input type="text" id="username" placeholder="請輸入姓名">
        <button class="btn" onclick="login()">開始訓練</button>
    </div>

    <div id="map"></div>
    <div id="action-container">
        <button id="ar-btn" class="btn" onclick="openCamera()">📷 點擊開啟鏡頭拍照</button>
    </div>

    <div id="camera-view">
        <video id="video" autoplay playsinline></video>
        <button style="position:absolute; top:20px; right:20px; padding: 10px; background: white; border: none; border-radius: 5px;" onclick="closeCamera()">關閉</button>
        <button class="btn" style="position:absolute; bottom:50px; width:80%; left:10%;" onclick="verifyAndScore()">📸 拍照確認</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ⚠️ 請務必確認此處已替換為您「重新部署後」的最新 GAS 網址
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyclSGjWNouBBJOUZlN2A705I9eZhOy4c-yjZL0l4M_Z2-9fK3leemIXRaZ78-RmGLH/exec";
        let userName = localStorage.getItem('userName');

        function login() {
            const name = document.getElementById('username').value;
            if(!name) return alert("請輸入姓名");
            localStorage.setItem('userName', name);
            userName = name;
            document.getElementById('login-modal').style.display = 'none';
        }

        if(!userName) {
            document.getElementById('login-modal').style.display = 'flex';
        } else {
            document.getElementById('login-modal').style.display = 'none';
        }

        // 🎯 修正後的數據同步功能：改用 URL-Encoded 標準格式發送，確保雲端能穩定收單
        function syncToSheet(score) {
            const params = new URLSearchParams();
            params.append('name', userName);
            params.append('score', score);

            fetch(GAS_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: params.toString()
            })
            .then(response => {
                console.log('試算表同步成功');
            })
            .catch(error => {
                console.error('同步至試算表時發生錯誤:', error);
            });
        }

        // 初始化地圖
        const map = L.map('map').setView([25.044229, 121.418815], 17);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const points = [
            { name: "警衛室", lat: 25.044150, lng: 121.418700, streetView: "https://www.google.com/maps?q=25.044150,121.418700" },
            { name: "大門廣場", lat: 25.044229, lng: 121.418815, streetView: "https://www.google.com/maps?q=25.044229,121.418815" },
            { name: "第一停車場", lat: 25.044000, lng: 121.418300, streetView: "https://www.google.com/maps?q=25.044000,121.418300" }
        ];

        points.forEach(p => {
            L.marker([p.lat, p.lng]).addTo(map)
                .bindPopup(`<b>${p.name}</b><br><a href="${p.streetView}" target="_blank">查看街景</a>`);
        });

        function openCamera() {
            document.getElementById('camera-view').style.display = 'block';
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
                .then(stream => { document.getElementById('video').srcObject = stream; })
                .catch(err => { alert("無法啟動相機"); closeCamera(); });
        }

        function verifyAndScore() {
            const score = 100;
            alert(`🌟 恭喜 ${userName} 打卡成功，獲得 ${score} 分！\n正在同步數據至雲端試算表...`);
            syncToSheet(score);
            closeCamera();
        }

        function closeCamera() {
            document.getElementById('camera-view').style.display = 'none';
            const video = document.getElementById('video');
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
        }
    </script>
</body>
</html>
