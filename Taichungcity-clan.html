<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺中市宗親人員統計與線路導航</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; display: flex; height: 100vh; }
        #map { flex: 1; height: 100%; }
        .panel-container { width: 350px; background: white; box-shadow: -2px 0 5px rgba(0,0,0,0.1); padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .panel-box { border: 1px solid #ccc; border-radius: 8px; padding: 10px; background: #fafafa; }
        h3 { margin-top: 0; color: #333; border-bottom: 2px solid #ddd; padding-bottom: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 6px; text-align: center; }
        th { background-color: #f2f2f2; }
        .total-row { font-weight: bold; background-color: #e6f7ff; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input[type="text"] { width: calc(100% - 70px); padding: 5px; display: inline-block; }
        .form-group button { padding: 5px 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .submit-btn { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        .checkbox-group { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="panel-container">
        
        <div class="panel-box">
            <h3>台中市宗親總統計表</h3>
            <p><strong>📊 全市總計人數</strong></p>
            <table>
                <tr class="total-row">
                    <td>總男性</td><td>總女性</td><td>台中總計</td>
                </tr>
                <tr>
                    <td>120 人</td><td>93 人</td><td>213 人</td>
                </tr>
            </table>
            
            <p><strong>🏘️ 各行政區人口一覽</strong></p>
            <div style="max-height: 200px; overflow-y: auto;">
                <table>
                    <thead>
                        <tr><th>行政區</th><th>男</th><th>女</th><th>總計</th><th>比例</th></tr>
                    </thead>
                    <tbody>
                        <tr><td><a href="#" class="district-link" data-district="大甲區">大甲區</a></td><td>56</td><td>47</td><td>103</td><td>48.36%</td></tr>
                        <tr><td><a href="#" class="district-link" data-district="外埔區">外埔區</a></td><td>1</td><td>2</td><td>3</td><td>1.41%</td></tr>
                        <tr><td><a href="#" class="district-link" data-district="大安區">大安區</a></td><td>2</td><td>1</td><td>3</td><td>1.41%</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="panel-box">
            <h3>臺中市宗親人員統計與線路導航</h3>
            <p style="font-size: 13px; color: #666;">請點擊地圖各區或總統計表查看宗親名單</p>
            
            <div class="form-group">
                <label>來源地址：</label>
                <input type="text" id="source-addr" placeholder="點擊人名自動帶入">
            </div>
            <div class="form-group">
                <label>目標地址：</label>
                <input type="text" id="target-addr" value="李武略宗祠">
            </div>

            <p><strong>🌟 台中熱門景點推薦：</strong></p>
            <div class="checkbox-group">
                <label><input type="checkbox" value="高美濕地"> 高美濕地</label>
                <label><input type="checkbox" value="逢甲夜市"> 逢甲夜市</label>
                <label><input type="checkbox" value="科博館"> 科博館</label>
                <label><input type="checkbox" value="歌劇院"> 歌劇院</label>
                <label><input type="checkbox" value="宮原眼科"> 宮原眼科</label>
                <label><input type="checkbox" value="台中火車站"> 台中火車站</label>
            </div>
            <button class="submit-btn" style="margin-top: 10px;">送出景點導航</button>
        </div>

        <div class="panel-box">
            <h3>💬 宗親與宗親交流</h3>
            <div class="form-group">
                <label>A.來源地址：</label>
                <input type="text" id="interact-a" placeholder="點擊查詢按鈕選取">
                <button type="button">查詢</button>
            </div>
            <div class="form-group">
                <label>B.目標地址：</label>
                <input type="text" id="interact-b" placeholder="點擊查詢按鈕選取">
                <button type="button">查詢</button>
            </div>
            <button class="submit-btn">送出交流路線</button>
        </div>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // === 1. 手機設備偵測與 LINE 外部瀏覽器強迫跳轉密技 ===
        (function() {
            // 偵測是否為行動裝置 (手機或平板)
            var isMobile = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            // 偵測當前網址是否已經帶有參數
            var hasParam = window.location.search.indexOf('openExternalBrowser=1') !== -1;

            // 只有「是手機」且「網址還沒有參數」時，才進行強迫跳轉
            if (isMobile && !hasParam) {
                var currentUrl = window.location.href;
                // 判斷原本網址有沒有其他參數，決定用 ? 還是 & 連接
                var separator = currentUrl.indexOf('?') !== -1 ? '&' : '?';
                
                // 重新導向到加上參數的網址，強迫 LINE 呼叫手機預設瀏覽器
                window.location.href = currentUrl + separator + "openExternalBrowser=1";
            }
        })();

        // === 2. 地圖初始化 (預設中心點設在台中) ===
        var map = L.map('map').setView([24.2332, 120.6432], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 點擊行政區連結的擴充彈性
        document.querySelectorAll('.district-link').forEach(function(link) {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                var district = this.getAttribute('data-district');
                alert('您點擊了：' + district + '，可在此處擴充篩選地圖標記的功能。');
            });
        });
    </script>
</body>
</html>
