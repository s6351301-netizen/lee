<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺中市宗親人員統計與線路導航</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; }
        #map { width: 100%; height: 100%; z-index: 1; }

        /* RWD 面板基礎樣式 */
        .custom-panel {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border-radius: 8px;
            max-height: 80vh;
            overflow-y: auto;
            pointer-events: auto;
        }

        /* 手機版適應 */
        @media (max-width: 768px) {
            .leaflet-control { margin: 5px !important; }
            .info-panel, .total-stats-panel { width: 90vw !important; max-width: 350px; }
        }

        /* 漢堡選單樣式 */
        .hamburger {
            display: none;
            padding: 10px;
            background: #fff;
            cursor: pointer;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        @media (max-width: 768px) {
            .hamburger { display: block; }
        }

        /* 其他 CSS 維持原樣，僅調整定位 */
        .info-panel { width: 340px; padding: 15px; }
        .total-stats-panel { width: 320px; padding: 12px; margin-top: 10px; }
        
        .panel-btn { cursor: pointer; font-size: 20px; }
        .nav-input-group { margin-top: 15px; border-top: 2px solid #ddd; padding-top: 10px; }
        .go-btn { background-color: #28a745; color: white; border: none; padding: 8px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <script>
        const map = L.map('map').setView([24.182, 120.713], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {}).addTo(map);

        // 簡化版邏輯控制
        const infoPanel = L.control({ position: 'topright' });
        infoPanel.onAdd = function() {
            let div = L.DomUtil.create('div', 'custom-panel info-panel');
            div.innerHTML = `
                <div id="nav-content">
                    <h4>導航與名單</h4>
                    <input type="text" id="srcLocation" value="李武略宗祠" style="width:90%">
                    <input type="text" id="targetLocation" placeholder="輸入目標地點" style="width:90%; margin-top:5px">
                    <button class="go-btn" onclick="alert('導航邏輯')">前往</button>
                    <div id="district-info">請點擊地圖區域</div>
                </div>
            `;
            return div;
        };
        infoPanel.addTo(map);

        const statsPanel = L.control({ position: 'topleft' });
        statsPanel.onAdd = function() {
            let div = L.DomUtil.create('div', 'custom-panel total-stats-panel');
            div.innerHTML = `
                <div class="hamburger" onclick="toggleStats()">☰ 統計表</div>
                <div id="stats-content">
                    <h4>臺中市宗親總統計</h4>
                    <p>全市總計：213人</p>
                </div>
            `;
            return div;
        };
        statsPanel.addTo(map);

        function toggleStats() {
            const content = document.getElementById('stats-content');
            content.style.display = content.style.display === 'none' ? 'block' : 'none';
        }

        // 處理視窗遮擋問題
        L.DomEvent.disableClickPropagation(infoPanel.getContainer());
        L.DomEvent.disableClickPropagation(statsPanel.getContainer());
    </script>
</body>
</html>
