<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺中市宗親人員統計與線路導航</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: "Microsoft JhengHei", sans-serif; background-color: #f4f4f4;
        }
        #map { width: 100%; height: 100%; }
        
        .info-panel, .total-stats-panel {
            padding: 15px; font-size: 14px; background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15); border-radius: 8px;
            overflow-y: auto; position: relative;
        }
        .info-panel { width: 340px; max-height: 520px; border-left: 5px solid #1a73e8; }
        .total-stats-panel { width: 320px; max-height: 400px; border-top: 5px solid #6f42c1; margin-top: 10px; }

        /* RWD 手機版設定 */
        @media (max-width: 600px) {
            .info-panel, .total-stats-panel {
                width: 85% !important; max-height: 30vh !important;
                font-size: 11px !important; padding: 8px !important;
            }
            .stats-table { font-size: 10px !important; }
            .hint-text { display: none; }
        }

        .panel-controls { position: absolute; top: 12px; right: 12px; display: flex; gap: 10px; z-index: 10; }
        .panel-btn { cursor: pointer; font-size: 14px; font-weight: bold; color: #aaa; user-select: none; }
        .panel-btn:hover { color: #e81123; }
        .stats-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; font-size: 13px; }
        .stats-table th, .stats-table td { border: 1px solid #ccc; padding: 5px; text-align: center; }
        .stats-table th { background-color: #f8f9fa; font-weight: bold; }
        .nav-input-group { margin-top: 12px; padding-top: 10px; border-top: 2px solid #ddd; }
        .nav-row { margin-bottom: 8px; display: flex; align-items: center; }
        .nav-row label { width: 75px; font-weight: bold; }
        .nav-row input { flex: 1; padding: 5px; border: 1px solid #ccc; border-radius: 4px; }
        .go-btn { background-color: #28a745; color: white; border: none; padding: 6px 18px; border-radius: 4px; cursor: pointer; }
        .highlight-text { color: #e81123; font-weight: bold; }
        .male-color { color: #0056b3; }
        .female-color { color: #b21f1f; }
        .clickable-name { color: #1a73e8; text-decoration: underline; cursor: pointer; margin-right: 8px; }
        .leaflet-routing-container { display: none !important; }
        .inspiration-panel { font-size: 12px; padding: 5px; background: rgba(255,255,255,0.8); border-radius: 4px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <script>
        const map = L.map('map').setView([24.182, 120.713], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);

        let taichungPeopleData = [];
        let isObservationPanelMinimized = false;
        let isTotalStatsPanelMinimized = false;

        // 手機偵測自動收合
        window.addEventListener('DOMContentLoaded', () => {
            if (window.innerWidth <= 600) {
                isTotalStatsPanelMinimized = true;
                isObservationPanelMinimized = true;
            }
        });

        // 引入您的邏輯函數... (為確保程式碼完整運作，請保留您原先的變數與函式)
        // 核心邏輯如下：
        
        const info = L.control({ position: 'topright' });
        info.onAdd = function(map) {
            this._div = L.DomUtil.create('div', 'info-panel');
            this.update();
            return this._div;
        };

        info.update = function() {
            this._div.innerHTML = isObservationPanelMinimized 
                ? `<div class="panel-controls" style="position:static"><span class="panel-btn" onclick="info.toggleMinimize()">➕</span></div>`
                : `<div class="panel-controls"><span class="panel-btn" onclick="info.toggleMinimize()">➖</span></div><h4>宗親統計</h4><p>請點擊行政區...</p>`;
        };

        info.toggleMinimize = function() {
            isObservationPanelMinimized = !isObservationPanelMinimized;
            this.update();
        };
        info.addTo(map);

        const totalStatsPanel = L.control({ position: 'topleft' });
        totalStatsPanel.onAdd = function(map) {
            this._div = L.DomUtil.create('div', 'total-stats-panel');
            this.update();
            return this._div;
        };

        totalStatsPanel.update = function() {
             this._div.innerHTML = isTotalStatsPanelMinimized 
                ? `<div class="panel-controls" style="position:static"><span class="panel-btn" onclick="totalStatsPanel.toggleMinimize()">➕</span></div>`
                : `<div class="panel-controls"><span class="panel-btn" onclick="totalStatsPanel.toggleMinimize()">➖</span></div><h4>台中總統計</h4><p>資料載入中...</p>`;
        };

        totalStatsPanel.toggleMinimize = function() {
            isTotalStatsPanelMinimized = !isTotalStatsPanelMinimized;
            this.update();
        };
        totalStatsPanel.addTo(map);

        // 載入資料 (請確認您的原始連結正確)
        fetch('https://s6351301-netizen.github.io/lee/json/data2.json')
            .then(res => res.json())
            .then(data => {
                taichungPeopleData = data;
                totalStatsPanel.update();
            });
    </script>
</body>
</html>
