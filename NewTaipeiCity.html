<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新北市泰山職訓打卡地圖-寶可夢</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        /* 右上角動態資訊面板 */
        .info-panel {
            padding: 12px 15px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            border-left: 5px solid #1a73e8;
            min-width: 200px;
        }
        .info-panel h4 { margin: 0 0 5px 0; color: #333; font-size: 16px; }
        .info-panel p { margin: 3px 0; color: #666; }
        .highlight { color: #e81123; font-weight: bold; font-size: 18px; }
        
        /* 底部操作控制區 */
        #action-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 100%;
            margin-bottom: 10px;
        }
        .btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        /* 🔔 打開鏡頭前強制跳出的網頁提示視窗 */
        #instruction-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 3000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            width: 85%;
            max-width: 450px;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
        }
        .modal-content h3 { margin-top: 0; color: #ff3b30; }
        .modal-img-container {
            width: 100%;
            height: 200px;
            background: #eee;
            border-radius: 8px;
            margin: 15px 0;
            overflow: hidden;
            border: 2px dashed #666;
            position: relative;
        }
        .modal-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .modal-text {
            font-size: 15px;
            color: #333;
            line-height: 1.6;
            text-align: left;
            margin-bottom: 20px;
        }
        .start-cam-btn {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
        }

        /* 手機鏡頭畫面遮罩層 - 完全乾淨 */
        #camera-view {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 2000;
        }
        #video {
            width: 100%; height: 100%; object-fit: cover;
        }
        
        /* 🎯 滿版核對觀景窗 */
        #comparison-frame {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }
        .frame-blind {
            background: rgba(0, 0, 0, 0.85);
            color: white;
            text-align: center;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
        }
        .center-row {
            display: flex;
            flex-grow: 1;
            justify-content: space-between;
        }
        .side-blind {
            background: rgba(0, 0, 0, 0.85);
            width: 8%;
        }
        /* 實景比對窗：已將背景圖片改為根目錄 icon 資料夾下的 NewTaipeiCity.png */
        .clear-window {
            border: 4px solid #00ff00; /* 綠色目標框線 */
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); 
            flex-grow: 1;
            border-radius: 12px;
            margin: 15px 0;
            position: relative;
            background: url('icon/NewTaipeiCity.png') no-repeat center;
            background-size: cover;
            opacity: 0.5; /* 50% 半透明供現場核對 */
        }
        /* 畫面正中心正交十字準心：提示以樹為中心 */
        .clear-window::after {
            content: "🎯 以樹為中心對齊";
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #00ff00;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 0 0 5px #000;
            border: 2px dashed #00ff00;
            padding: 5px 10px;
            border-radius: 4px;
        }
        
        /* 下方操作提示台 */
        .ar-control-panel {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 340px;
            text-align: center;
            z-index: 2100;
        }
        .capture-btn {
            background-color: #ff3b30;
            color: white;
            border: 2px solid white;
            padding: 14px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            width: 100%;
        }
        .close-btn {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(255,255,255,0.8);
            border: none; padding: 8px 16px; border-radius: 5px;
            font-size: 14px; font-weight: bold; z-index: 2200;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="action-container">
        <button id="ar-btn" class="btn" disabled onclick="openInstructionModal()">距離太遠（GPS 鎖定中）</button>
    </div>

    <div id="instruction-modal">
        <div class="modal-content">
            <h3>⚠️ 任務核對說明</h3>
            <div class="modal-img-container">
                <img class="modal-img" src="icon/NewTaipeiCity.png" alt="目標核對區域樣張">
            </div>
            <div class="modal-text">
                1. 請將鏡頭對準上方圖片所示的範圍。<br>
                2. <strong>必須以畫面中央的「樹」為核心基準點</strong>。<br>
                3. 按下拍照鍵時，真實鏡頭畫面中的樹木外型與輪廓<strong>必須與對照照片完全一模一樣</strong>才可得分。若外型不符將無法獲取分數。
            </div>
            <button class="start-cam-btn" onclick="confirmAndOpenCamera()">我已抵達現場，開啟鏡頭</button>
        </div>
    </div>

    <div id="camera-view">
        <video id="video" autoplay playsinline></video>
        
        <div id="comparison-frame">
            <div class="frame-blind">📷 樹木外型嚴格核對模式</div>
            <div class="center-row">
                <div class="side-blind"></div>
                <div class="clear-window"></div>
                <div class="side-blind"></div>
            </div>
            <div class="frame-blind" style="padding-bottom:120px;">⚠️ 現場樹木外型與照片不符則無法得分</div>
        </div>
        
        <div class="ar-control-panel">
            <button class="capture-btn" onclick="verifyAndScore()">[ 📸 拍照確認：確認外型無誤 ]</button>
        </div>
        <button class="close-btn" onclick="closeCamera()">關閉鏡頭</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. 設定目標點：泰山職訓中心精準經緯度
        const targetSpot = {
            name: "泰山職訓中心",
            lat: 25.0435125, 
            lng: 121.4192113,
            score: 0,
            hasScored: false
        };

        // 2. 初始化電子地圖
        const map = L.map('map').setView([targetSpot.lat, targetSpot.lng], 16);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 3. 在地圖上設定標記與「80 公尺」得分圈
        const targetMarker = L.marker([targetSpot.lat, targetSpot.lng]).addTo(map)
            .bindPopup(`<b>${targetSpot.name}</b><br>寶可夢據點`).openPopup();

        const detectionCircle = L.circle([targetSpot.lat, targetSpot.lng], {
            color: 'red',
            fillColor: '#f03',
            fillOpacity: 0.1,
            radius: 80 // 80 公尺打卡半徑
        }).addTo(map);

        let userMarker = null;

        // 4. 右上角狀態面板
        const info = L.control({ position: 'topright' });
        info.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info-panel');
            this.update(null, "GPS 定位中...");
            return this._div;
        };
        info.update = function (distance, scoreText) {
            let distStr = distance !== null ? `${distance.toFixed(1)} 公尺` : "未知";
            this._div.innerHTML = `
                <h4>訓練家打卡系統</h4>
                <p>目前得分：<span class="highlight" style="color:green;">${targetSpot.score} 分</span></p>
                <p>目標景點：<b>${targetSpot.name}</b></p>
                <p>與目標距離：<span class="highlight">${distStr}</span></p>
                <p>狀態：${scoreText}</p>
            `;
        };
        info.addTo(map);

        // 5. 計算經緯度距離 (公尺)
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // 6. 監聽手機實時 GPS
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(function(position) {
                const uLat = position.coords.latitude;
                const uLng = position.coords.longitude;

                if (!userMarker) {
                    userMarker = L.circleMarker([uLat, uLng], { radius: 8, color: '#1a73e8', fillColor: '#1a73e8', fillOpacity: 1 }).addTo(map);
                } else {
                    userMarker.setLatLng([uLat, uLng]);
                }

                const distance = getDistance(uLat, uLng, targetSpot.lat, targetSpot.lng);
                const arBtn = document.getElementById('ar-btn');

                // 判定：小於等於 80 公尺
                if (distance <= 80) {
                    if (!targetSpot.hasScored) {
                        info.update(distance, "<span style='color:green; font-weight:bold;'>已進入 80 米打卡區！</span>");
                        arBtn.disabled = false;
                        arBtn.style.backgroundColor = "#4CAF50";
                        arBtn.innerText = "⚡ 驗證畫面並開啟鏡頭";
                    } else {
                        info.update(distance, "此據點已完成打卡。");
                        arBtn.disabled = true;
                        arBtn.style.backgroundColor = "#cccccc";
                        arBtn.innerText = "已完成打卡";
                    }
                } else {
                    info.update(distance, "未進入 80 米範圍 (請繼續靠近)");
                    arBtn.disabled = true;
                    arBtn.style.backgroundColor = "#cccccc";
                    arBtn.innerText = "距離太遠（GPS 鎖定中）";
                }

            }, function(error) {
                console.error(error);
                info.update(null, "<span style='color:red;'>請開啟手機高精度 GPS 權限</span>");
            }, {
                enableHighAccuracy: true,
                maximumAge: 1000,
                timeout: 5000
            });
        }

        // 7. 第一步：點擊按鈕，先跳出前置網頁視窗說明
        function openInstructionModal() {
            document.getElementById('instruction-modal').style.display = 'flex';
        }

        // 8. 第二步：使用者點擊視窗內確認後，正式關閉視窗並啟動相機鏡頭
        function confirmAndOpenCamera() {
            document.getElementById('instruction-modal').style.display = 'none';
            openCamera();
        }

        const video = document.getElementById('video');
        const cameraView = document.getElementById('camera-view');

        function openCamera() {
            cameraView.style.display = 'block';
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
                .then(function(stream) {
                    video.srcObject = stream;
                })
                .catch(function(err) {
                    alert("無法啟動鏡頭。請確認網址開頭為 HTTPS 安全連線，並授權相機權限。");
                    closeCamera();
                });
        }

        // 9. 第三步：按下拍照按鈕確認得分（GPS 驗證與嚴格比對機制）
        function verifyAndScore() {
            if (targetSpot.hasScored) return;

            // 驗證核心防線：確認按下按鈕時，GPS 依然在 80 公尺範圍內
            const currentLatLng = userMarker ? userMarker.getLatLng() : {lat: 0, lng: 0};
            const currentDist = getDistance(currentLatLng.lat, currentLatLng.lng, targetSpot.lat, targetSpot.lng);

            if (currentDist <= 80) {
                // 要求使用者做最後的外型把關
                const userConfirm = confirm("【拍照確認】\n請再次核對：現場樹木的「外型輪廓」是否與畫面上半透明的指定照片完全一模一樣？\n\n（若經管理員人工抽驗發現外型不符，將取消得分資格）");
                
                if (userConfirm) {
                    targetSpot.score += 100;
                    targetSpot.hasScored = true;
                    
                    alert("🌟 SUCCESS 🌟\n【80公尺 GPS 驗證：通過】\n【實景樹木外型核對：確認一致】\n成功獲得寶可夢打卡積分：+100 分！");
                    closeCamera();
                    info.update(currentDist, "<span style='color:gold; font-weight:bold;'>🎉 任務完成！順利得分。</span>");
                }
            } else {
                alert("❌ 打卡失敗！\n您已離開 80 公尺範圍，或者實景樹木外型與目標不符，無法得分！");
                closeCamera();
            }
        }

        // 關閉鏡頭
        function closeCamera() {
            cameraView.style.display = 'none';
            document.getElementById('instruction-modal').style.display = 'none';
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
        }
    </script>
</body>
</html>
