<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新北市泰山職訓打卡地圖-寶可夢</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        /* 右上角動態資訊面板 */
        .info-panel {
            padding: 12px 15px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            border-left: 5px solid #1a73e8;
            min-width: 200px;
        }
        .info-panel h4 { margin: 0 0 5px 0; color: #333; font-size: 16px; }
        .info-panel p { margin: 3px 0; color: #666; }
        .highlight { color: #e81123; font-weight: bold; font-size: 18px; }
        
        /* 底部相機與打卡控制區 */
        #action-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 100%;
            margin-bottom: 10px;
        }
        .btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        /* 手機鏡頭與對照畫面遮罩 */
        #camera-view {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
        }
        #video {
            width: 100%; height: 100%; object-fit: cover;
        }
        /* 對照圖片遮罩 - 半透明疊加在相機畫面上 */
        #comparison-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80%; /* 依需求微調對照圖的大小 */
            height: auto;
            opacity: 0.5; /* 半透明效果供玩家對照 */
            pointer-events: none; /* 讓點擊事件穿透到相機畫面 */
            border: 4px solid yellow; /* 醒目的邊框 */
        }
        .ar-overlay {
            position: absolute;
            bottom: 15%; left: 50%;
            transform: translateX(-50%);
            color: #00FF00;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 0 8px #000;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 10px;
        }
        .close-btn {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(255,255,255,0.7);
            border: none; padding: 10px 20px; border-radius: 5px;
            font-size: 16px; font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="action-container">
        <button id="ar-btn" class="btn" disabled onclick="openCameraWithComparison()">距離太遠（鎖定中）</button>
    </div>

    <div id="camera-view">
        <video id="video" autoplay playsinline></video>
        <img id="comparison-overlay" src="https://image-gen.fineshare.com/1-1f9e9f90f6ff9e9a3f1249b6574f85e3.png" alt="對照用景點照片">
        <div class="ar-overlay">
            🧩 拿起來核對畫面！<br>
            <span style="font-size:16px;">[對齊後點擊畫面任意處捕捉得分]</span>
        </div>
        <button class="close-btn" onclick="closeCamera()">關閉鏡頭</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. 設定目標點：泰山職訓中心
        const targetSpot = {
            name: "泰山職訓中心",
            lat: 25.0487, 
            lng: 121.4173,
            score: 0,
            hasScored: false // 防止重複得分
        };

        // 2. 初始化地圖（OpenStreetMap 電子街景地圖）
        const map = L.map('map').setView([targetSpot.lat, targetSpot.lng], 16);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // 3. 在地圖上標記目標點與判判定圈
        const targetMarker = L.marker([targetSpot.lat, targetSpot.lng]).addTo(map)
            .bindPopup(`<b>${targetSpot.name}</b><br>寶可夢景點打卡點`).openPopup();

        const detectionCircle = L.circle([targetSpot.lat, targetSpot.lng], {
            color: 'red',
            fillColor: '#f03',
            fillOpacity: 0.15,
            radius: 3 // 得分範圍：3 公尺內
        }).addTo(map);

        // 當前使用者的 GPS 定位標記
        let userMarker = null;

        // 4. 右上角狀態資訊面板
        const info = L.control({ position: 'topright' });
        info.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info-panel');
            this.update(null, "定位中...");
            return this._div;
        };
        info.update = function (distance, scoreText) {
            let distStr = distance !== null ? `${distance.toFixed(1)} 公尺` : "未知";
            this._div.innerHTML = `
                <h4>訓練家打卡系統</h4>
                <p>目前得分：<span class="highlight" style="color:green;">${targetSpot.score} 分</span></p>
                <p>目標景點：<b>${targetSpot.name}</b></p>
                <p>與目標距離：<span class="highlight">${distStr}</span></p>
                <p>狀態：${scoreText}</p>
            `;
        };
        info.addTo(map);

        // 5. 計算兩個經緯度之間的距離 (單位：公尺)
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // 6. 追蹤手機實時 GPS 定位
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(function(position) {
                const uLat = position.coords.latitude;
                const uLng = position.coords.longitude;

                // 更新地圖上的玩家位置
                if (!userMarker) {
                    userMarker = L.circleMarker([uLat, uLng], { radius: 8, color: '#1a73e8', fillColor: '#1a73e8', fillOpacity: 1 }).addTo(map);
                } else {
                    userMarker.setLatLng([uLat, uLng]);
                }

                // 計算與目標點的距離
                const distance = getDistance(uLat, uLng, targetSpot.lat, targetSpot.lng);
                const arBtn = document.getElementById('ar-btn');

                // 判斷是否在 3 公尺得分範圍內
                if (distance <= 3) {
                    info.update(distance, "<span style='color:green; font-weight:bold;'>GPS 定位已確認，可進行畫面核對！</span>");
                    arBtn.disabled = false;
                    arBtn.style.backgroundColor = "#4CAF50";
                    arBtn.innerText = "開啟鏡頭核對畫面";
                } else {
                    info.update(distance, "請靠近目標 3 公尺內");
                    arBtn.disabled = true;
                    arBtn.style.backgroundColor = "#cccccc";
                    arBtn.innerText = "距離太遠（GPS 鎖定中）";
                }

            }, function(error) {
                console.error("GPS 定位失敗", error);
                info.update(null, "<span style='color:red;'>請開啟手機 GPS 並允許定位權限</span>");
            }, {
                enableHighAccuracy: true, // 開啟高精度模式
                maximumAge: 1000,
                timeout: 5000
            });
        } else {
            alert("您的瀏覽器不支援網路定位功能。");
        }

        // 7. AR 手機鏡頭與對照控制邏輯
        const video = document.getElementById('video');
        const cameraView = document.getElementById('camera-view');

        function openCameraWithComparison() {
            cameraView.style.display = 'block';
            // 請求開啟手機後置鏡頭
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
                .then(function(stream) {
                    video.srcObject = stream;
                })
                .catch(function(err) {
                    alert("無法啟動相機鏡頭。請確認網址為 HTTPS 安全連線，並已允許瀏覽器開啟相機。");
                    console.error(err);
                    closeCamera();
                });
        }

        // 當鏡頭核對無誤後，玩家點擊畫面捕捉得分
        cameraView.addEventListener('click', function(e) {
            // 如果點擊的是關閉按鈕，則不執行得分邏輯
            if(e.target.className === 'close-btn') return;
            
            // 防止重複得分，且需要 GPS 在範圍內
            if (!targetSpot.hasScored && parseFloat(document.querySelector(".highlight:last-of-type").innerText) <= 3) {
                targetSpot.score += 100; // 得分
                targetSpot.hasScored = true;
                alert("畫面核對無誤，捕捉成功！獲得 100 分！");
                closeCamera();
                // 更新計分面板
                const currentDist =parseFloat(document.querySelector(".highlight:last-of-type").innerText);
                info.update(currentDist, "已完成打卡！已獲得分數。");
            } else if (targetSpot.hasScored) {
                alert("您已經完成此景點的打卡囉。");
                closeCamera();
            } else {
                alert("GPS 定位好像跳走了，請回此景點 3 公尺內。");
                closeCamera();
            }
        });

        function closeCamera() {
            cameraView.style.display = 'none';
            if (video.srcObject) {
                // 關閉相機硬體省電
                video.srcObject.getTracks().forEach(track => track.stop());
            }
        }
    </script>
</body>
</html>
