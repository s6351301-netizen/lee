<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>泰山寶可夢據點 - 訓練家登入</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background: #121212; color: #ffffff;
            display: flex; justify-content: center; align-items: center;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 90%;
            max-width: 360px;
            text-align: center;
        }
        h2 { margin-bottom: 5px; color: #ffeb3b; }
        p { color: #aaa; font-size: 14px; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        
        /* 標籤列布局，讓標籤與姓名提示並排 */
        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        label { font-size: 14px; color: #ccc; }
        
        /* AJAX 姓名動態顯示樣式 */
        #user-name-preview {
            font-size: 14px;
            font-weight: bold;
            transition: color 0.3s;
        }
        .status-searching { color: #ff9800; } /* 搜尋中：橘色 */
        .status-success { color: #00ff00; }   /* 找到姓名：綠色 */
        .status-fail { color: #ff3b30; }      /* 找不到：紅色 */

        input {
            width: 100%; padding: 12px; box-sizing: border-box;
            border-radius: 8px; border: 1px solid #444;
            background: #222; color: #fff; font-size: 16px;
        }
        input:focus { border-color: #4CAF50; outline: none; }
        .btn {
            background-color: #4CAF50; color: white; border: none;
            padding: 14px; font-size: 18px; font-weight: bold;
            border-radius: 8px; cursor: pointer; width: 100%;
            margin-top: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background 0.2s;
        }
        .btn:hover { background-color: #45a049; }

        /* =========================================================================
           🧩 以下為滑動拼圖专属樣式 (完美融合深色主體，並加上燈箱浮動效果)
           ========================================================================= */
        .captcha-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .captcha-container {
            width: 300px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            border: 1px solid #333;
            user-select: none;
            text-align: left;
        }
        .canvas-area {
            position: relative;
            width: 300px;
            height: 180px;
            margin-bottom: 15px;
            background: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
        }
        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #blockCanvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }
        .slider-track {
            position: relative;
            width: 300px;
            height: 40px;
            background: #2a2a2a;
            border-radius: 20px;
            border: 1px solid #444;
            box-sizing: border-box;
        }
        .slider-text {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            line-height: 38px;
            font-size: 14px;
            color: #aaa;
            z-index: 1;
        }
        .slider-btn {
            position: absolute;
            top: -1px;
            left: 0;
            width: 40px;
            height: 40px;
            background: #4CAF50;
            color: #fff;
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            font-weight: bold;
            transition: background 0.2s;
        }
        .slider-btn:hover {
            background: #45a049;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>⚔️ 身份驗證</h2>
        <p>請輸入您的培訓資料以進入寶可夢地圖</p>
        
        <div class="input-group">
            <div class="label-row">
                <label for="user-no">帳號 或 編號 (座號)</label>
                <!-- 🎯 AJAX 姓名動態顯示區 -->
                <span id="user-name-preview"></span>
            </div>
            <!-- 當輸入框失去焦點 (onblur) 或手動點選密碼欄時，即時觸發 AJAX 查詢 -->
            <input type="text" id="user-no" placeholder="例如：01" onblur="checkUserRealtime()">
        </div>
        
        <div class="input-group">
            <label for="user-password">密碼</label>
            <input type="password" id="user-password" placeholder="請輸入密碼">
        </div>
        
        <!-- 🎯 點擊按鈕改為先進入安全驗證過濾器 -->
        <button class="btn" onclick="triggerCaptcha(event)">驗證並進入地圖</button>
    </div>

    <!-- 🧩 滑動拼圖獨立彈出燈箱區區塊 -->
    <div class="captcha-modal" id="captchaModal">
        <div class="captcha-container">
            <h3 style="margin-top:0; color:#ffeb3b; margin-bottom:5px; font-size:18px;">🛡️ 安全驗證</h3>
            <p style="font-size:13px; color:#bbb; margin-top:0; margin-bottom:15px;">請拖動滑塊填補拼圖圖塊</p>
            
            <div class="canvas-area">
                <canvas id="bgCanvas" width="300" height="180"></canvas>
                <canvas id="blockCanvas" width="300" height="180"></canvas>
            </div>

            <div class="slider-track" id="sliderTrack">
                <div class="slider-text">向右滑動核對圖案</div>
                <div class="slider-btn" id="sliderBtn">➔</div>
            </div>
            <button class="btn" style="padding:8px; font-size:14px; margin-top:15px; background-color:#555;" onclick="closeCaptcha()">取消驗證</button>
        </div>
    </div>

    <script>
        
        // 🎯 網址已完美更新為您的第 5 版最新部署網址
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwc8q_X4_p4ZXcVoDZUxWd3wnaIdqUdhIF6XkL6CCsg5aI7WTjyzVvQD35ueFYTU-_L/exec"; 

        // 🔄 核心 AJAX 功能：即時透過帳號比對試算表並顯示姓名
        function checkUserRealtime() {
            const noInput = document.getElementById('user-no').value.trim();
            const previewSpan = document.getElementById('user-name-preview');
            
            // 如果使用者清空了帳號欄位，就跟著清空提示字
            if (!noInput) {
                previewSpan.innerText = "";
                return;
            }

            // 先顯示正在飛速查詢中
            previewSpan.className = "status-searching";
            previewSpan.innerText = "🔍 查詢中...";

            const params = new URLSearchParams();
            params.append('action', 'checkUser'); // 呼叫第 5 版新增的單純查名動作
            params.append('帳號', noInput);

            fetch(GAS_URL, {
                method: 'POST',
                body: params
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // 🟢 綠色字體：成功比對到試算表上的訓練家姓名
                    previewSpan.className = "status-success";
                    previewSpan.innerText = `👤 訓練家：${data.name}`;
                } else {
                    // 🔴 紅色字體：試算表會員資料分頁找不到此帳號
                    previewSpan.className = "status-fail";
                    previewSpan.innerText = "❌ 查無此帳號/座號";
                }
            })
            .catch(error => {
                console.error(error);
                previewSpan.className = "status-fail";
                previewSpan.innerText = "⚠️ 連線失敗";
            });
        }

        // 🔐 帳號密碼完整登入驗證功能
        function handleLogin() {
            const noInput = document.getElementById('user-no').value.trim();
            const passwordInput = document.getElementById('user-password').value.trim();
            
            if (!noInput || !passwordInput) {
                return alert("請填寫帳號與密碼！");
            }
            
            const params = new URLSearchParams();
            params.append('action', 'login'); 
            params.append('帳號', noInput);
            params.append('密碼', passwordInput);

            fetch(GAS_URL, {
                method: 'POST',
                body: params
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert(`歡迎回來，${data.name} 訓練家！`);
                    
                    // 快取存檔，讓下一頁地圖可以直接讀取使用
                    localStorage.setItem('trainerNo', noInput);
                    localStorage.setItem('trainerName', data.name);
                    
                    // 成功登入後跳轉地圖
                    window.location.href = "NewTaipeiCity.html"; 
                } else {
                    alert("❌ 登入失敗：" + data.message);
                }
            })
            .catch(error => {
                alert("連線失敗，請檢查網路或 GAS 網址！");
                console.error(error);
            });
        }

        // =========================================================================
        // 🧩 以下為滑動拼圖核心控制邏輯 (與原有程式碼無衝突，完美介接)
        // =========================================================================
        const bgCanvas = document.getElementById('bgCanvas');
        const blockCanvas = document.getElementById('blockCanvas');
        const sliderBtn = document.getElementById('sliderBtn');
        const sliderTrack = document.getElementById('sliderTrack');
        const captchaModal = document.getElementById('captchaModal');

        const bgCtx = bgCanvas.getContext('2d');
        const blockCtx = blockCanvas.getContext('2d');

        const r = 9; // 拼圖凸起半徑
        const w = 40; // 拼圖主體寬度
        const h = 40; // 拼圖主體高度
        const PI = Math.PI;

        let targetX = 0;
        let targetY = 0;
        let trail = []; 
        let startTime = 0;

        const img = new Image();
        img.crossOrigin = "Anonymous"; 
        img.src = 'https://picsum.photos/300/180'; 
        img.onload = function() {
            initCaptcha();
        };

        function drawPieceShape(ctx, x, y) {
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + w / 2 - r, y);
            ctx.arc(x + w / 2, y, r, PI, 0, false);
            ctx.lineTo(x + w, y);
            ctx.lineTo(x + w, y + h / 2 - r);
            ctx.arc(x + w, y + h / 2, r, 1.5 * PI, 0.5 * PI, false);
            ctx.lineTo(x + w, y + h);
            ctx.lineTo(x, y + h);
            ctx.lineTo(x, y);
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.stroke();
        }

        function initCaptcha() {
            targetX = Math.floor(Math.random() * (300 - w - r - 100)) + 100;
            targetY = Math.floor(Math.random() * (180 - h - r * 2)) + r;
            bgCtx.drawImage(img, 0, 0, 300, 180);
            blockCtx.save();
            drawPieceShape(blockCtx, targetX, targetY);
            blockCtx.clip();
            blockCtx.drawImage(img, 0, 0, 300, 180);
            const pieceData = blockCtx.getImageData(targetX - 2, targetY - r, w + r * 2, h + r * 2);
            blockCanvas.width = 300; 
            blockCtx.putImageData(pieceData, 0, targetY - r);
            blockCtx.restore();
            bgCtx.save();
            drawPieceShape(bgCtx, targetX, targetY);
            bgCtx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            bgCtx.fill();
            bgCtx.restore();
        }

        let isDragging = false;
        let startX = 0;

        sliderBtn.addEventListener('mousedown', startDrag);
        sliderBtn.addEventListener('touchstart', startDrag);

        function startDrag(e) {
            isDragging = true;
            startTime = new Date().getTime();
            trail = []; 
            const clientX = e.clientX || e.touches[0].clientX;
            startX = clientX;
        }

        window.addEventListener('mousemove', doDrag);
        window.addEventListener('touchmove', doDrag, { passive: false });

        function doDrag(e) {
            if (!isDragging) return;
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            let moveX = clientX - startX;

            if (moveX < 0) moveX = 0;
            if (moveX > 260) moveX = 260;

            sliderBtn.style.left = moveX + 'px';
            blockCanvas.style.transform = `translateX(${moveX}px)`;

            trail.push({
                t: new Date().getTime() - startTime,
                x: clientX,
                y: clientY
            });
        }

        window.addEventListener('mouseup', stopDrag);
        window.addEventListener('touchend', stopDrag);

        function stopDrag() {
            if (!isDragging) return;
            isDragging = false;
            const finalX = parseInt(sliderBtn.style.left || 0);
            verifyOnServer(finalX, trail);
        }

        function verifyOnServer(userX, userTrail) {
            const isPositionCorrect = Math.abs(userX - targetX) <= 4;
            const isHuman = checkTrailIsHuman(userTrail);

            if (isPositionCorrect && isHuman) {
                // 🟢 驗證成功：關閉驗證碼，放行並執行原有的 handleLogin 登入功能
                captchaModal.style.display = "none";
                handleLogin(); 
            } else {
                alert('❌ 驗證失敗！可能是拼圖沒對準，或偵測到自動化腳本行為。');
                resetCaptcha();
            }
        }

        function checkTrailIsHuman(userTrail) {
            if (userTrail.length < 5) return false;
            let yMovements = userTrail.map(p => p.y);
            let yDiff = Math.max(...yMovements) - Math.min(...yMovements);
            if (yDiff === 0) return false; 
            return true;
        }

        function resetCaptcha() {
            sliderBtn.style.left = '0px';
            blockCanvas.style.transform = 'translateX(0px)';
            bgCtx.clearRect(0, 0, 300, 180);
            blockCtx.clearRect(0, 0, 300, 180);
            img.src = 'https://picsum.photos/300/180?sig=' + Math.random();
        }

        // 🚀 控制驗證碼彈出的攔截器
        function triggerCaptcha(event) {
            const noInput = document.getElementById('user-no').value.trim();
            const passwordInput = document.getElementById('user-password').value.trim();
            
            // 如果連帳密都沒填，直接被原有邏輯擋掉，不跳驗證碼
            if (!noInput || !passwordInput) {
                return alert("請填寫帳號與密碼！");
            }
            
            // 填寫完畢，開啟滑動拼圖彈窗
            captchaModal.style.display = "flex";
            resetCaptcha();
        }

        function closeCaptcha() {
            captchaModal.style.display = "none";
        }
    </script>
</body>
</html>
