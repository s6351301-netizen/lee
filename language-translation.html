<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>免驗證隨身語音翻譯官</title>
    <style>
        :root {
            --primary-color: #1a73e8;
            --primary-hover: #1557b0;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #3c4043;
            --border-color: #dadce0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            padding: 24px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--primary-color);
            font-size: 1.5rem;
        }

        .control-panel {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        select {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background-color: #fff;
            cursor: pointer;
            outline: none;
            width: 100%;
        }

        select:focus {
            border-color: var(--primary-color);
        }

        .swap-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--primary-color);
            padding: 5px;
        }

        .translation-box {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .textarea-wrapper {
            position: relative;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: #fff;
            padding: 12px;
        }

        .textarea-wrapper.active {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
        }

        textarea {
            width: 100%;
            height: 110px;
            border: none;
            resize: none;
            outline: none;
            font-size: 16px;
            color: var(--text-color);
        }

        .action-bar {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 8px;
        }

        .btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            width: 40px;
            height: 40px;
        }

        .btn:hover {
            background-color: #f1f3f4;
        }

        .btn-mic {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-mic:hover {
            background-color: var(--primary-hover);
        }

        .btn-mic.recording {
            background-color: #ea4335;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .status-text {
            text-align: center;
            font-size: 12px;
            color: #70757a;
            margin-top: 10px;
        }

        svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>隨身語音翻譯官</h2>

    <div class="control-panel">
        <select id="srcLang">
            <option value="zh-TW" selected>繁體中文 (台灣)</option>
            <option value="en-US">英文 (美國)</option>
            <option value="ja-JP">日本語 (日本)</option>
            <option value="ko-KR">韓文 (韓國)</option>
        </select>
        <button class="swap-btn" id="swapLang" title="切換語言">⇄</button>
        <select id="targetLang">
            <option value="zh-TW">繁體中文 (台灣)</option>
            <option value="en-US" selected>英文 (美國)</option>
            <option value="ja-JP">日本語 (日本)</option>
            <option value="ko-KR">韓文 (韓國)</option>
        </select>
    </div>

    <div class="translation-box">
        <div class="textarea-wrapper" id="inputWrapper">
            <textarea id="inputText" placeholder="點擊麥克風開始說話，或在此輸入文字..."></textarea>
            <div class="action-bar">
                <button class="btn btn-mic" id="micBtn" title="語音輸入">
                    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.42 2.72 6.2 6 6.6V21h2v-3.4c3.28-.4 6-3.18 6-6.6h-1.7z"/></svg>
                </button>
                <button class="btn" id="speakSrcBtn" title="播放原文" style="color:#5f6368;">
                    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 2.85-5 3.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </button>
            </div>
        </div>

        <div class="textarea-wrapper" style="background-color: #f1f3f4;">
            <textarea id="outputText" placeholder="翻譯結果將顯示在此..." readonly></textarea>
            <div class="action-bar">
                <button class="btn" id="copyBtn" title="複製文字" style="color:#5f6368;">
                    <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                </button>
                <button class="btn" id="speakTargetBtn" title="語音朗讀" style="color:var(--primary-color);">
                    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 2.85-5 3.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <div class="status-text" id="statusText">準備就緒</div>
</div>

<script>
    // 檢查瀏覽器支援度
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const synth = window.speechSynthesis;

    if (!SpeechRecognition) {
        alert("您的瀏覽器不支援語音辨識功能，請使用 Google Chrome、Edge 或 Safari 瀏覽器。");
    }

    // 取得 DOM 元素
    const srcLangSelect = document.getElementById('srcLang');
    const targetLangSelect = document.getElementById('targetLang');
    const swapLangBtn = document.getElementById('swapLang');
    const inputText = document.getElementById('inputText');
    const outputText = document.getElementById('outputText');
    const micBtn = document.getElementById('micBtn');
    const speakSrcBtn = document.getElementById('speakSrcBtn');
    const speakTargetBtn = document.getElementById('speakTargetBtn');
    const copyBtn = document.getElementById('copyBtn');
    const statusText = document.getElementById('statusText');
    const inputWrapper = document.getElementById('inputWrapper');

    let recognition;
    let isRecording = false;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = false; // 說完一句自動結束
        recognition.interimResults = false; // 不顯示過渡結果

        recognition.onstart = () => {
            isRecording = true;
            micBtn.classList.add('recording');
            inputWrapper.classList.add('active');
            statusText.innerText = "聆聽中，請說話...";
        };

        recognition.onend = () => {
            isRecording = false;
            micBtn.classList.remove('recording');
            inputWrapper.classList.remove('active');
            statusText.innerText = "辨識結束";
        };

        recognition.onerror = (event) => {
            statusText.innerText = "語音辨識出錯: " + event.error;
            isRecording = false;
            micBtn.classList.remove('recording');
        };

        recognition.onresult = (event) => {
            const resultText = event.results[0][0].transcript;
            inputText.value = resultText;
            statusText.innerText = "辨識成功，正在翻譯...";
            translateText(resultText);
        };
    }

    // 麥克風點擊事件
    micBtn.addEventListener('click', () => {
        if (!SpeechRecognition) return;
        if (isRecording) {
            recognition.stop();
        } else {
            recognition.lang = srcLangSelect.value;
            recognition.start();
        }
    });

    // 雙向切換語言與文字
    swapLangBtn.addEventListener('click', () => {
        const tempLang = srcLangSelect.value;
        srcLangSelect.value = targetLangSelect.value;
        targetLangSelect.value = tempLang;
        
        const tempText = inputText.value;
        inputText.value = outputText.value;
        outputText.value = tempText;
        statusText.innerText = "語言已切換";
    });

    // 免費翻譯功能 (利用 MyMemory 免費公開 API)
    function translateText(text) {
        if (!text.trim()) return;
        
        const from = srcLangSelect.value.split('-')[0];
        const to = targetLangSelect.value === 'zh-TW' ? 'zh-TW' : targetLangSelect.value.split('-')[0];

        statusText.innerText = "翻譯中...";
        
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;

        fetch(url)
            .then(res => res.json())
            .then(data => {
                if (data.responseData) {
                    let translated = data.responseData.translatedText;
                    outputText.value = translated;
                    statusText.innerText = "翻譯完成，準備朗讀...";
                    // 自動語音播放翻譯後的文字
                    speak(translated, targetLangSelect.value);
                } else {
                    statusText.innerText = "翻譯失敗";
                }
            })
            .catch(err => {
                console.error(err);
                statusText.innerText = "網路錯誤，無法翻譯";
            });
    }

    // 手動文字輸入後敲 Enter 鍵也能觸發翻譯
    inputText.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            translateText(inputText.value);
        }
    });

    // 語音合成播放 (TTS)
    function speak(text, lang) {
        if (!synth || !text.trim()) return;
        
        // 如果正在播放，先取消上一則
        synth.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = 1.0; // 語速：1.0 為正常速度

        utterance.onend = () => {
            statusText.innerText = "播放完畢";
        };

        synth.speak(utterance);
    }

    // 點擊按鈕手動播放原文
    speakSrcBtn.addEventListener('click', () => {
        speak(inputText.value, srcLangSelect.value);
    });

    // 點擊按鈕手動播放譯文
    speakTargetBtn.addEventListener('click', () => {
        speak(outputText.value, targetLangSelect.value);
    });

    // 複製譯文按鈕
    copyBtn.addEventListener('click', () => {
        if (!outputText.value) return;
        navigator.clipboard.writeText(outputText.value).then(() => {
            const originalText = statusText.innerText;
            statusText.innerText = "已複製譯文到剪貼簿！";
            setTimeout(() => statusText.innerText = originalText, 2000);
        });
    });
</script>

</body>
</html>
