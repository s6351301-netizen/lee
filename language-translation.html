<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>免驗證隨身語音翻譯官</title>
    <style>
        :root {
            --primary-color: #1a73e8;
            --primary-hover: #1557b0;
            --video-color: #0f9d58;
            --video-hover: #0b8043;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #3c4043;
            --border-color: #dadce0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            padding: 24px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--primary-color);
            font-size: 1.5rem;
        }

        .control-panel {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        select {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background-color: #fff;
            cursor: pointer;
            outline: none;
            width: 100%;
        }

        select:focus {
            border-color: var(--primary-color);
        }

        .swap-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--primary-color);
            padding: 5px;
        }

        .translation-box {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .textarea-wrapper {
            position: relative;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: #fff;
            padding: 12px;
        }

        .textarea-wrapper.active {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
        }

        .textarea-wrapper.recording-video {
            border-color: var(--video-color);
            box-shadow: 0 0 0 2px rgba(15,157,88,0.2);
        }

        /* 讓輸入框容器內部可以容納影片與文字 */
        .input-content-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        textarea {
            width: 100%;
            height: 110px;
            border: none;
            resize: none;
            outline: none;
            font-size: 16px;
            color: var(--text-color);
            background: transparent;
        }

        /* 即時預覽鏡頭與錄完呈現的影片樣式 */
        video {
            width: 100%;
            max-height: 240px;
            border-radius: 8px;
            background: #000;
            display: none; /* 預設隱藏，有影像才顯示 */
        }

        .action-bar {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 8px;
        }

        .btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.1s;
            width: 40px;
            height: 40px;
        }

        .btn:hover {
            background-color: #f1f3f4;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-mic {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-mic:hover {
            background-color: var(--primary-hover);
        }

        .btn-mic.recording {
            background-color: #ea4335;
            animation: pulse 1.5s infinite;
        }

        .btn-video {
            background-color: var(--video-color);
            color: white;
        }

        .btn-video:hover {
            background-color: var(--video-hover);
        }

        .btn-video.recording {
            background-color: #ea4335;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .status-text {
            text-align: center;
            font-size: 12px;
            color: #70757a;
            margin-top: 10px;
        }

        svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>隨身語音翻譯官</h2>

    <div class="control-panel">
        <select id="srcLang">
            <option value="zh-TW" selected>繁體中文 (台灣)</option>
            <option value="en-US">英文 (美國)</option>
            <option value="ja-JP">日本語 (日本)</option>
            <option value="ko-KR">韓文 (韓國)</option>
        </select>
        <button class="swap-btn" id="swapLang" title="切換語言">⇄</button>
        <select id="targetLang">
            <option value="zh-TW">繁體中文 (台灣)</option>
            <option value="en-US" selected>英文 (美國)</option>
            <option value="ja-JP">日本語 (日本)</option>
            <option value="ko-KR">韓文 (韓國)</option>
        </select>
    </div>

    <div class="translation-box">
        <div class="textarea-wrapper" id="inputWrapper">
            <div class="input-content-area">
                <textarea id="inputText" placeholder="點擊麥克風或攝影機開始，或在此輸入文字..."></textarea>
                <video id="videoPreview" controls playsinline></video>
            </div>
            <div class="action-bar">
                <button class="btn btn-video" id="videoBtn" title="錄影翻譯 (限5分鐘)">
                    <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4zM14 13h-3v3H9v-3H6v-2h3V8h2v3h3v2z"/></svg>
                </button>
                <button class="btn btn-mic" id="micBtn" title="純語音輸入">
                    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.42 2.72 6.2 6 6.6V21h2v-3.4c3.28-.4 6-3.18 6-6.6h-1.7z"/></svg>
                </button>
                <button class="btn" id="speakSrcBtn" title="播放原文" style="color:#5f6368;">
                    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 2.85-5 3.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </button>
            </div>
        </div>

        <div class="textarea-wrapper" style="background-color: #f1f3f4;">
            <textarea id="outputText" placeholder="翻譯結果將顯示在此..." readonly></textarea>
            <div class="action-bar">
                <button class="btn" id="copyBtn" title="複製文字" style="color:#5f6368;">
                    <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                </button>
                <button class="btn" id="speakTargetBtn" title="語音朗讀" style="color:var(--primary-color);">
                    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 2.85-5 3.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <div class="status-text" id="statusText">準備就緒</div>
</div>

<script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const synth = window.speechSynthesis;

    if (!SpeechRecognition) {
        alert("您的瀏覽器不支援語音辨識功能，請使用 Google Chrome、Edge 或 Safari 瀏覽器。");
    }

    // DOM 元素
    const srcLangSelect = document.getElementById('srcLang');
    const targetLangSelect = document.getElementById('targetLang');
    const swapLangBtn = document.getElementById('swapLang');
    const inputText = document.getElementById('inputText');
    const outputText = document.getElementById('outputText');
    const micBtn = document.getElementById('micBtn');
    const videoBtn = document.getElementById('videoBtn');
    const videoPreview = document.getElementById('videoPreview');
    const speakSrcBtn = document.getElementById('speakSrcBtn');
    const speakTargetBtn = document.getElementById('speakTargetBtn');
    const copyBtn = document.getElementById('copyBtn');
    const statusText = document.getElementById('statusText');
    const inputWrapper = document.getElementById('inputWrapper');

    let recognition;
    let isRecordingMic = false;
    
    // 錄影相關變數
    let isRecordingVideo = false;
    let mediaRecorder;
    let recordedChunks = [];
    let streamTracks = null;
    let videoTimeout;
    let videoSpeechResult = ""; 

    // 初始化語音辨識
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true; // 錄影可能較長，開啟連續辨識
        recognition.interimResults = false;

        recognition.onresult = (event) => {
            let currentResult = "";
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    currentResult += event.results[i][0].transcript;
                }
            }
            
            if (isRecordingVideo) {
                // 錄影模式：先暫存文字，最後一起呈現
                videoSpeechResult += currentResult;
            } else {
                // 純麥克風模式：即時呈現並翻譯
                inputText.value = currentResult;
                translateText(currentResult);
            }
        };

        recognition.onerror = (event) => {
            console.error("辨識錯誤:", event.error);
            if (event.error !== 'no-speech') {
                statusText.innerText = "語音辨識出錯: " + event.error;
            }
        };
    }

    /* ==========================================
       純語音麥克風功能
       ========================================== */
    micBtn.addEventListener('click', () => {
        if (!SpeechRecognition) return;
        if (isRecordingVideo) {
            alert("請先停止錄影再使用純語音輸入。");
            return;
        }

        if (isRecordingMic) {
            recognition.stop();
            isRecordingMic = false;
            micBtn.classList.remove('recording');
            inputWrapper.classList.remove('active');
            statusText.innerText = "辨識結束";
        } else {
            inputText.value = "";
            videoPreview.style.display = "none";
            recognition.lang = srcLangSelect.value;
            recognition.continuous = false; // 純語音說完單句即結束
            recognition.start();
            
            isRecordingMic = true;
            micBtn.classList.add('recording');
            inputWrapper.classList.add('active');
            statusText.innerText = "聆聽中，請說話...";
        }
    });

    /* ==========================================
       新功能：視訊鏡頭錄影功能 (限制5分鐘)
       ========================================== */
    videoBtn.addEventListener('click', async () => {
        if (!SpeechRecognition) return;
        if (isRecordingMic) {
            alert("請先停止純語音輸入再開啟錄影。");
            return;
        }

        if (isRecordingVideo) {
            // 手動停止錄影
            stopVideoRecording();
        } else {
            // 跳出警告提示
            const confirmProceed = confirm("【隱私安全提示】\n本功能錄製的影片「不會」做任何檔案儲存或伺服器上傳，僅作當下即時文字解析與語言翻譯使用。是否開啟相機？");
            if (!confirmProceed) return;

            try {
                // 請求同時開啟視訊與音訊
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                streamTracks = stream;
                
                // 設定即時預覽
                videoPreview.srcObject = stream;
                videoPreview.muted = true; // 預覽時靜音避免回音
                videoPreview.style.display = "block";
                videoPreview.play();

                // 初始化錄影
                recordedChunks = [];
                videoSpeechResult = "";
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    // 錄影停止後，將錄好的影片轉成 URL 放進 video 標籤
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    videoPreview.srcObject = null;
                    videoPreview.src = URL.createObjectURL(blob);
                    videoPreview.muted = false; // 回放時開啟聲音
                    
                    // 呈現文字：先文字，換行後顯示影片（影片已在下方）
                    inputText.value = videoSpeechResult || "(未偵測到語音文字)";
                    
                    // 觸發翻譯
                    if(videoSpeechResult) translateText(videoSpeechResult);
                    statusText.innerText = "錄影結束，已產生解析文字與影片";
                };

                // 同步啟動語音辨識
                recognition.lang = srcLangSelect.value;
                recognition.continuous = true;
                recognition.start();

                // 開始錄影
                mediaRecorder.start();
                isRecordingVideo = true;
                videoBtn.classList.add('recording');
                inputWrapper.classList.add('recording-video');
                statusText.innerText = "正在錄影與解析語音 (限時 5 分鐘)...";

                // 設定 5 分鐘 (300,000 毫秒) 自動停止限制
                videoTimeout = setTimeout(() => {
                    statusText.innerText = "已達 5 分鐘錄影上限，自動停止...";
                    stopVideoRecording();
                }, 300000);

            } catch (err) {
                console.error("無法開啟相機:", err);
                alert("無法存取相機或麥克風，請檢查瀏覽器權限設定。");
            }
        }
    });

    function stopVideoRecording() {
        if (!isRecordingVideo) return;
        clearTimeout(videoTimeout);

        // 停止錄影機
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
        }
        // 停止語音辨識
        recognition.stop();
        
        // 關閉相機鏡頭串流
        if (streamTracks) {
            streamTracks.getTracks().forEach(track => track.stop());
        }

        isRecordingVideo = false;
        videoBtn.classList.remove('recording');
        inputWrapper.classList.remove('recording-video');
    }

    /* ==========================================
       翻譯與基礎控制邏輯
       ========================================== */
    swapLangBtn.addEventListener('click', () => {
        const tempLang = srcLangSelect.value;
        srcLangSelect.value = targetLangSelect.value;
        targetLangSelect.value = tempLang;
        
        const tempText = inputText.value;
        inputText.value = outputText.value;
        outputText.value = tempText;
        statusText.innerText = "語言已切換";
    });

    function translateText(text) {
        if (!text.trim()) return;
        
        const from = srcLangSelect.value.split('-')[0];
        const to = targetLangSelect.value === 'zh-TW' ? 'zh-TW' : targetLangSelect.value.split('-')[0];

        statusText.innerText = "翻譯中...";
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;

        fetch(url)
            .then(res => res.json())
            .then(data => {
                if (data.responseData) {
                    let translated = data.responseData.translatedText;
                    outputText.value = translated;
                    statusText.innerText = "翻譯完成，自動朗讀...";
                    speak(translated, targetLangSelect.value);
                } else {
                    statusText.innerText = "翻譯失敗";
                }
            })
            .catch(err => {
                console.error(err);
                statusText.innerText = "網路錯誤，無法翻譯";
            });
    }

    inputText.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            translateText(inputText.value);
        }
    });

    function speak(text, lang) {
        if (!synth || !text.trim()) return;
        synth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = 1.0;
        utterance.onend = () => { statusText.innerText = "播放完畢"; };
        synth.speak(utterance);
    }

    speakSrcBtn.addEventListener('click', () => speak(inputText.value, srcLangSelect.value));
    speakTargetBtn.addEventListener('click', () => speak(outputText.value, targetLangSelect.value));
    
    copyBtn.addEventListener('click', () => {
        if (!outputText.value) return;
        navigator.clipboard.writeText(outputText.value).then(() => {
            const originalText = statusText.innerText;
            statusText.innerText = "已複製譯文！";
            setTimeout(() => statusText.innerText = originalText, 2000);
        });
    });
</script>

</body>
</html>
